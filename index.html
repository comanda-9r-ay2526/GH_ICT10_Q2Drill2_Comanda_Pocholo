<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css" />
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
    <title>Math Club Member Checker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f0f4f8;
            color: #333;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Container Card styling */
        .card {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
            text-align: center;
        }

        h1 {
            color: #1e3a8a;
            font-size: 1.5rem;
            margin-bottom: 20px;
        }

        /* Form & Input Fields */
        form {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #cbd5e1;
            border-radius: 8px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s ease, box-shadow 0.2s ease;
        }

        input[type="text"]:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.2);
        }

        /* Search Button */
        input[type="button"] {
            background-color: #2563eb;
            color: #ffffff;
            font-size: 1rem;
            font-weight: 600;
            padding: 12px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.2s ease, transform 0.1s ease;
        }

        input[type="button"]:hover {
            background-color: #1d4ed8;
        }

        input[type="button"]:active {
            transform: scale(0.98);
        }

        /* Output Result Div Styling */
        #duy {
            margin-top: 20px;
            padding: 15px;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 500;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            background-color: #f8fafc;
            border: 1px dashed #cbd5e1;
            color: #475569;
        }

        /* Removes dash border if content exists inside #duy */
        #duy:not(:empty) {
            border: 1px solid #e2e8f0;
            background-color: #eff6ff;
            color: #1e40af;
        }
    </style>
</head>
<body>

    <div class="card">
        <h1>Math Club Member Checker</h1>
        <form>
            <input type="text" name="" id="firstname" placeholder="First name">
            <input type="text" name="" id="lolname" placeholder="Last name">
            <input type="button" py-click="naemu" value="Search">
        </form>

        <div id="duy">Enter a name to check membership status.</div>
    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
